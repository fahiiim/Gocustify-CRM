name: CI/CD Pipeline & EC2 Deploy

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mabdel Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "Mabdel Backend/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest app/tests -q -k "not test_realtime_live"

  security-guard:
    name: Repository Security & Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/security_guard.py

  website:
    name: Website (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mabdel Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Mabdel Website/package-lock.json"
      - run: npm ci
      - run: npm run test
      - run: npm run build

  dashboard:
    name: Admin Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madbel-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "madbel-dashboard/package-lock.json"
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: [backend, security-guard, website, dashboard]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 600s
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/home/ubuntu/Mabdel"
            PERSISTENT_ENV_DIR="/home/ubuntu/persistent_env"
            REPO_URL="https://github.com/fahiiim/Gocustify-CRM.git"
            BRANCH="main"

            echo "=== Step 1: Safeguarding Manual .env Files ==="
            mkdir -p "$PERSISTENT_ENV_DIR"
            if [ -f "$APP_DIR/Mabdel Backend/.env" ]; then
              cp "$APP_DIR/Mabdel Backend/.env" "$PERSISTENT_ENV_DIR/backend.env"
            fi
            if [ -f "$APP_DIR/Mabdel Website/.env" ]; then
              cp "$APP_DIR/Mabdel Website/.env" "$PERSISTENT_ENV_DIR/website.env"
            fi
            if [ -f "$APP_DIR/madbel-dashboard/.env" ]; then
              cp "$APP_DIR/madbel-dashboard/.env" "$PERSISTENT_ENV_DIR/dashboard.env"
            fi

            echo "=== Step 2: Cleaning Previous Files & Syncing Latest Code ==="
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -d ".git" ]; then
              git clone "$REPO_URL" .
            fi
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd -e "uploads" -e "private_uploads" -e "*.env*"

            echo "=== Step 3: Executing Production Deployment ==="
            chmod +x deploy/deploy_ec2.sh
            bash deploy/deploy_ec2.sh
